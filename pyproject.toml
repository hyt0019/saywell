[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "saywell"
version = "0.6.2"
description = "Windows voice input with local ASR and configurable API cleanup"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "keyring>=25,<27",
  "PySide6-Essentials>=6.8,<7",
  "sherpa-onnx>=1.13.8,<2",
  "sounddevice>=0.5,<1",
  "numpy>=2,<3",
  "av>=14,<18",
  "pypinyin>=0.55,<1",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.12,<7", "ruff>=0.11,<1"]

[project.scripts]
saywell = "saywell.app:main"
saywell-cli = "saywell.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
saywell = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
